<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Farm Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>🌱 Farm Planner</h1>

    <div class="container">
        <section>
            <h2>Add Activity</h2>

            <input type="month" id="month">

            <select id="type">
                <option value="Plant">Plant</option>
                <option value="Harvest">Harvest</option>
                <option value="Task">Task</option>
            </select>

            <input type="text" id="field" placeholder="Field Name">

            <input type="text" id="crop" placeholder="Crop / Task">

            <button onclick="addActivity()">Add</button>
        </section>

        <section>
            <h2>Planned Activities</h2>
            <div id="activities"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
